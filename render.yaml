databases:
  - name: hrms-db
    databaseName: hrms
    user: hrms
    plan: free

  # --- Multi-tenant control plane -------------------------------------------
  # tenant-admin's own metadata (tenants, plans, modules). Never holds HR data.
  - name: hrms-tenant-admin-db
    databaseName: tenant_admin
    user: tenant_admin
    plan: basic-256mb

  # Shared instance holding ONE DATABASE PER TENANT — tenant-admin creates and
  # drops those databases itself (tenants/provisioning.py).
  - name: hrms-tenants-db
    databaseName: tenants
    user: tenants_admin
    plan: basic-1gb

services:
  - type: redis
    name: hrms-redis
    plan: free
    ipAllowList: []

  - type: web
    name: hrms-visionaries          # → https://hrms-visionaries.onrender.com
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "hrms-visionaries.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://waziniawang-ops.github.io"
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hrms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: hrms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: hrms-redis
          property: connectionString
      # Add these in the Render dashboard after signing up at cloudinary.com
      # - key: CLOUDINARY_CLOUD_NAME
      # - key: CLOUDINARY_API_KEY
      # - key: CLOUDINARY_API_SECRET

  - type: worker
    name: hrms-celery
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config.celery worker --loglevel=info"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hrms-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: hrms-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: hrms-redis
          property: connectionString

  - type: web
    name: hrms-visionaries-frontend  # → https://hrms-visionaries-frontend.onrender.com
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: "https://hrms-visionaries.onrender.com/api/v1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Tenant control plane: Django API + React UI in one Docker service. Creates,
  # suspends, re-plans and deletes each tenant's own Render services + database.
  - type: web
    name: hrms-tenant-admin
    runtime: docker
    plan: starter
    dockerfilePath: ./tenant-admin/Dockerfile
    dockerContext: ./tenant-admin
    healthCheckPath: /healthz/
    preDeployCommand: "python manage.py migrate --no-input && python manage.py ensure_operator"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-tenant-admin-db
          property: connectionString
      - key: TENANT_APPS_DB_ADMIN_URL
        fromDatabase:
          name: hrms-tenants-db
          property: connectionString
      - key: TENANT_REPO_URL
        value: "https://github.com/waziniawang-ops/HRMSv2"
      - key: TENANT_REPO_BRANCH
        value: "main"
      - key: TENANT_RENDER_REGION
        value: "singapore"
      - key: TENANT_BACKEND_PLAN
        value: "starter"
      # Copied into every tenant backend so uploads work (shared Cloudinary account).
      - key: TENANT_SHARED_ENV_KEYS
        value: "CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET"
      # Set these in the Render dashboard:
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID          # workspace id from GET https://api.render.com/v1/owners
        sync: false
      - key: TENANT_ADMIN_PASSWORD_ENCRYPTION_KEY   # a Fernet key, see tenant-admin/config/settings.py
        sync: false
      - key: OPERATOR_USERNAME        # first operator login, created once by ensure_operator
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
